# ════════════════════════════════════════════════════════════════════
#  GitHub Events Streaming Stack
# ════════════════════════════════════════════════════════════════════

networks:
  github-stream:
    driver: bridge

volumes:
  kafka-data:
  timescale-data:
  grafana-data:

services:
  # ── Kafka (KRaft mode) ──────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    networks: [github-stream]
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_RETENTION_BYTES: 536870912
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ── Kafka UI ───────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [github-stream]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ── Topic initialisation ───────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    networks: [github-stream]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo '--- Creating Kafka topics ---'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic github.events.raw --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic github.events.status --partitions 3 --replication-factor 1

      echo '--- Topics ready ---'
      "
    restart: "no"

  # ── TimescaleDB ────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    networks: [github-stream]
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB:       github_events
      POSTGRES_USER:     github
      POSTGRES_PASSWORD: github_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github -d github_events"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── GitHub API Producer ────────────────────────────────────────
  producer:
    build: ./producer
    pull_policy: build
    container_name: github-producer
    networks: [github-stream]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GITHUB_TOKEN_EVENTS:     ${GITHUB_TOKEN_EVENTS:-}
      POLL_INTERVAL_SECONDS:   "10"
      MAX_PAGES:               "3"
    restart: unless-stopped

  # ── Consumer / Enricher ────────────────────────────────────────
  consumer:
    build: ./consumer
    pull_policy: build
    container_name: github-consumer
    networks: [github-stream]
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GITHUB_TOKEN_USER:       ${GITHUB_TOKEN_USER:-}
      GITHUB_TOKEN_REPO:       ${GITHUB_TOKEN_REPO:-}
      DB_HOST:                 timescaledb
      DB_PORT:                 "5432"
      DB_NAME:                 github_events
      DB_USER:                 github
      DB_PASSWORD:             github_secret
    restart: unless-stopped

  # ── Grafana (Visualisation) ────────────────────────────────────
  grafana:
      image: grafana/grafana-oss:latest
      container_name: grafana
      networks: [github-stream]
      ports:
        - "3001:3000"
      environment:
        - GF_SECURITY_ADMIN_PASSWORD=admin
      volumes:
        - grafana-data:/var/lib/grafana
        # HIER DIE MAGIE: Lokale Dateien in den Container mounten
        - ./grafana/provisioning:/etc/grafana/provisioning
      depends_on:
        timescaledb:
          condition: service_healthy
