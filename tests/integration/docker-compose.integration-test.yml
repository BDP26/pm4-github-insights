# Minimal stack for multi-consumer integration tests.
# Differences from the main docker-compose.yml:
#   - No container_name fields (Docker auto-names by project to avoid prod conflicts)
#   - Kafka external port: 19094  (avoids clash with prod 9094)
#   - TimescaleDB port: 15432     (avoids clash with prod 5432)
#   - GitHub tokens set to an invalid value so the API returns 401 fast (no timeouts)
#   - No grafana, no kafka-ui, no producer

networks:
  test-stream:
    driver: bridge

volumes:
  test-kafka-data:
  test-timescale-data:

services:
  kafka:
    image: apache/kafka:3.9.0
    networks: [test-stream]
    ports:
      - "19094:19094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "IntegTestCluster1234567890A"
    volumes:
      - test-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    networks: [test-stream]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic github.events.raw --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic github.events.status --partitions 3 --replication-factor 1
      "
    restart: "no"

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    networks: [test-stream]
    ports:
      - "15432:5432"
    volumes:
      - test-timescale-data:/var/lib/postgresql/data
      - ../../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: github_events
      POSTGRES_USER: github
      POSTGRES_PASSWORD: github_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github -d github_events"]
      interval: 5s
      timeout: 3s
      retries: 10

  consumer-0:
    build: ../../consumer
    networks: [test-stream]
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    # Redirect GitHub API to localhost so enrichment calls fail immediately
    # with "Connection refused" instead of DNS/TLS timeout (which can take 30s+).
    extra_hosts:
      - "api.github.com:127.0.0.1"
    environment:
      KAFKA_BOOTSTRAP_SERVERS:      kafka:9092
      DB_HOST:                      timescaledb
      DB_PORT:                      "5432"
      DB_NAME:                      github_events
      DB_USER:                      github
      DB_PASSWORD:                  github_secret
      GITHUB_TOKEN_USER:            "ghp_integration_test_invalid_token"
      GITHUB_TOKEN_REPO:            "ghp_integration_test_invalid_token"
      KAFKA_MULTI_INSTANCE_ENABLED: "true"
      KAFKA_INSTANCE_INDEX:         "0"
      KAFKA_TOTAL_INSTANCES:        "3"
    restart: on-failure

  consumer-1:
    build: ../../consumer
    networks: [test-stream]
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    extra_hosts:
      - "api.github.com:127.0.0.1"
    environment:
      KAFKA_BOOTSTRAP_SERVERS:      kafka:9092
      DB_HOST:                      timescaledb
      DB_PORT:                      "5432"
      DB_NAME:                      github_events
      DB_USER:                      github
      DB_PASSWORD:                  github_secret
      GITHUB_TOKEN_USER:            "ghp_integration_test_invalid_token"
      GITHUB_TOKEN_REPO:            "ghp_integration_test_invalid_token"
      KAFKA_MULTI_INSTANCE_ENABLED: "true"
      KAFKA_INSTANCE_INDEX:         "1"
      KAFKA_TOTAL_INSTANCES:        "3"
    restart: on-failure

  consumer-2:
    build: ../../consumer
    networks: [test-stream]
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    extra_hosts:
      - "api.github.com:127.0.0.1"
    environment:
      KAFKA_BOOTSTRAP_SERVERS:      kafka:9092
      DB_HOST:                      timescaledb
      DB_PORT:                      "5432"
      DB_NAME:                      github_events
      DB_USER:                      github
      DB_PASSWORD:                  github_secret
      GITHUB_TOKEN_USER:            "ghp_integration_test_invalid_token"
      GITHUB_TOKEN_REPO:            "ghp_integration_test_invalid_token"
      KAFKA_MULTI_INSTANCE_ENABLED: "true"
      KAFKA_INSTANCE_INDEX:         "2"
      KAFKA_TOTAL_INSTANCES:        "3"
    restart: on-failure
